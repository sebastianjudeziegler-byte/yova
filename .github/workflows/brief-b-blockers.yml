name: Brief B focused blockers
on:
  push:
    branches: [codex/brief-b-living-plan]
concurrency:
  group: brief-b-focused-blockers
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Los_Angeles
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove regression-only release decision red then green
        run: |
          mkdir -p artifacts/blockers
          cp scripts/live-gate/regression.mjs "$RUNNER_TEMP/regression-green.mjs"
          git show 4db2b78:scripts/live-gate/regression.mjs > scripts/live-gate/regression.mjs
          set +e
          node --test scripts/live-gate/regression.test.mjs > artifacts/blockers/release-rule-red.txt 2>&1
          result=$?
          set -e
          cp "$RUNNER_TEMP/regression-green.mjs" scripts/live-gate/regression.mjs
          test "$result" -ne 0
          node --test scripts/live-gate/regression.test.mjs | tee artifacts/blockers/release-rule-green.txt
      - name: Verify scoped corrections and static gates
        run: |
          mkdir -p artifacts/blockers
          pnpm exec vitest run --reporter=default --reporter=json --outputFile=artifacts/blockers/unit.json
          pnpm lint
          pnpm exec tsc --noEmit
      - name: Install isolated browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise six blocked cases on desktop and mobile
        run: pnpm test:e2e e2e/core-learning-loop.spec.ts e2e/plan-schedule-date.spec.ts --grep 'visibly shortened inside recipe|10-minute outside teaching-first session|overdue outside teaching-first session|overdue arbitrary inside session|scheduled-review setup stays fixed|shorter sessions preserve weekly availability' --retries=0 --repeat-each=3 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/blockers/browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brief-b-blockers-${{ github.run_id }}
          path: |
            artifacts/blockers
            test-results
          retention-days: 30
