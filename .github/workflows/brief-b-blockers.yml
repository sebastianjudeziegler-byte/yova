name: Brief B focused blockers
on:
  push:
    branches: [codex/brief-b-living-plan]
concurrency:
  group: brief-b-focused-blockers
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Los_Angeles
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture shortening regression before correction
        continue-on-error: true
        run: |
          mkdir -p artifacts/blockers
          pnpm exec vitest run src/lib/plan-revision/revision-shortening.test.ts src/lib/plan-generation/revision-clock-windows.test.ts --reporter=default --reporter=json --outputFile=artifacts/blockers/shortening-red.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brief-b-blockers-${{ github.run_id }}
          path: artifacts/blockers
          retention-days: 30
