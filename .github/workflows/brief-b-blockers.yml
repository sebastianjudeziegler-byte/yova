name: Brief B focused blockers
on:
  push:
    branches: [codex/brief-b-living-plan]
concurrency:
  group: brief-b-focused-blockers
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Los_Angeles
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replay A18 and capacity protection on the rejected implementation
        run: |
          mkdir -p artifacts/blockers
          cp src/evals/fixed-plan-journey.ts /tmp/fixed-plan-journey.ts
          cp src/lib/plan-revision/build-plan-revision.ts /tmp/build-plan-revision.ts
          trap 'cp /tmp/fixed-plan-journey.ts src/evals/fixed-plan-journey.ts; cp /tmp/build-plan-revision.ts src/lib/plan-revision/build-plan-revision.ts' EXIT
          git show b96e7bc:src/evals/fixed-plan-journey.ts > src/evals/fixed-plan-journey.ts
          git show 28a9226:src/lib/plan-revision/build-plan-revision.ts > src/lib/plan-revision/build-plan-revision.ts
          set +e
          pnpm exec vitest run src/evals/a18-capacity.test.ts src/lib/plan-revision/revision-shortening.test.ts --reporter=default --reporter=json --outputFile=artifacts/blockers/capacity-red.json
          result=$?
          set -e
          test "$result" != 0
      - name: Verify scoped corrections and static gates
        run: |
          mkdir -p artifacts/blockers
          pnpm exec vitest run --reporter=default --reporter=json --outputFile=artifacts/blockers/unit.json
          pnpm lint
          pnpm exec tsc --noEmit
      - name: Install isolated browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise six blocked cases on desktop and mobile
        run: pnpm test:e2e e2e/core-learning-loop.spec.ts e2e/plan-schedule-date.spec.ts --grep 'visibly shortened inside recipe|10-minute outside teaching-first session|overdue outside teaching-first session|overdue arbitrary inside session|scheduled-review setup stays fixed|shorter sessions preserve weekly availability' --retries=0 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/blockers/browser.json
      - name: A18 real provider three serial samples
        if: ${{ !cancelled() }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOVA_RUN_LIVE_JOURNEY_EVALS: "1"
          YOVA_JOURNEY_EVAL_CASE: history_writing_outside
        run: |
          result=0
          for sample in 1 2 3; do
            pnpm exec vitest run src/evals/plan-session-journey.live.test.ts --reporter=default --reporter=json --outputFile="artifacts/blockers/a18-green-$sample.json" > "artifacts/blockers/a18-green-$sample.log" 2>&1 || result=1
            cat "artifacts/blockers/a18-green-$sample.log"
          done
          exit "$result"
      - name: Confirm corrected A18 canary against exact main
        if: ${{ !cancelled() }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOVA_RUN_LIVE_JOURNEY_EVALS: "1"
          YOVA_JOURNEY_EVAL_CASE: history_writing_outside
        run: |
          release=$(git rev-parse HEAD)
          mkdir -p /tmp/a18-main-canary
          cp src/evals/fixed-plan-journey.ts src/evals/plan-session-journey.live.test.ts src/evals/plan-rubric.ts /tmp/a18-main-canary/
          git restore next-env.d.ts
          git checkout --detach c7b3ca99964524cefc04437b7236b37fe8fe2666
          cp /tmp/a18-main-canary/* src/evals/
          set +e
          pnpm exec vitest run src/evals/plan-session-journey.live.test.ts --reporter=default --reporter=json --outputFile=artifacts/blockers/a18-corrected-main.json > artifacts/blockers/a18-corrected-main.log 2>&1
          result=$?
          set -e
          cat artifacts/blockers/a18-corrected-main.log
          git restore src/evals/plan-session-journey.live.test.ts src/evals/plan-rubric.ts
          rm src/evals/fixed-plan-journey.ts
          git checkout --detach "$release"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brief-b-blockers-${{ github.run_id }}
          path: |
            artifacts/blockers
            test-results
          retention-days: 30
