name: Full live gate

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Same-repository PR number to check (blank checks main)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: yova-full-live-gate
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Los_Angeles
      DO_NOT_TRACK: "1"
    steps:
      - name: Resolve main or a trusted PR revision
        id: revision
        uses: actions/github-script@v7
        env:
          REQUESTED_PR: ${{ inputs.pr }}
        with:
          script: |
            const number = process.env.REQUESTED_PR?.trim();
            if (!number) {
              const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
              core.setOutput('sha', branch.commit.sha);
              return;
            }
            if (!/^[1-9][0-9]*$/.test(number)) throw new Error('PR must be a positive number');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(number) });
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Live provider credentials are not exposed to fork code');
            }
            core.setOutput('sha', pr.head.sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Initialize unavailable setup artifact
        run: |
          mkdir -p test-results/live-gate
          node -e 'const fs=require("node:fs"); const r={counts:{pass:0,fail:0,flaky:0,unavailable:1},exitCode:0,rows:[{file:"environment",name:"Live gate setup",status:"unavailable",detail:"Dependencies or browser installation did not finish; no live result"}]}; fs.writeFileSync("test-results/live-gate/report.json",JSON.stringify(r,null,2)); fs.writeFileSync("test-results/live-gate/report.md","# Live gate: UNAVAILABLE\n\nDependency/browser setup has not completed. No tests are red or green. See setup logs.\n");'
      - name: Install dependencies and isolated browser
        id: setup
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verify gate accounting
        if: steps.setup.outcome == 'success'
        run: pnpm test:live:runner
      - name: Run every live canary and both browser journeys
        if: steps.setup.outcome == 'success'
        run: pnpm test:live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Publish table in job summary
        if: always()
        run: |
          if test -f test-results/live-gate/report.md; then
            cat test-results/live-gate/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Live gate did not start: dependency or runner setup unavailable. See the failed setup step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload one live-gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-live-gate-${{ github.run_id }}
          path: test-results/live-gate
          if-no-files-found: warn
          retention-days: 30
      - name: Attach live-gate status to the tested commit
        if: always() && steps.revision.outputs.sha
        uses: actions/github-script@v7
        env:
          TESTED_SHA: ${{ steps.revision.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('node:fs');
            const path = 'test-results/live-gate/report.json';
            const report = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : null;
            const failed = process.env.JOB_STATUS === 'failure' || Boolean(report?.counts?.fail);
            const counts = report?.counts;
            const description = counts ? `${counts.pass} pass / ${counts.fail} fail / ${counts.flaky} flaky / ${counts.unavailable} unavailable` : 'Setup unavailable; no live results';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.TESTED_SHA,
              context: 'Full live gate', state: failed ? 'failure' : 'success',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
