name: Brief B development evidence

on:
  push:
    branches: [codex/brief-b-living-plan]

concurrency:
  group: yova-brief-b-baseline
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: America/Los_Angeles
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare evidence directory
        run: mkdir -p artifacts/brief-b-baseline
      - name: Capture source-list reload red against 58ba8f5
        continue-on-error: true
        run: |
          source=src/lib/supabase/learning-state-repository.ts
          cp "$source" "$RUNNER_TEMP/brief-b-repository.ts"
          trap 'cp "$RUNNER_TEMP/brief-b-repository.ts" "$source"' EXIT
          git show 58ba8f5:"$source" > "$source"
          pnpm exec vitest run src/lib/supabase/learning-state-repository.test.ts -t 'keeps an undone source out' 2>&1 | tee artifacts/brief-b-baseline/source-reload-red.txt
      - name: Capture route contract baseline
        env:
          YOVA_DB_FIXTURE_PATH: /tmp/yova-living-plan-routed.test.sql
        id: route
        continue-on-error: true
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=artifacts/brief-b-baseline/routes.json
      - name: Capture typecheck
        if: always()
        continue-on-error: true
        run: pnpm exec tsc --noEmit 2>&1 | tee artifacts/brief-b-baseline/typecheck.txt
      - name: Capture lint
        if: always()
        continue-on-error: true
        run: pnpm lint 2>&1 | tee artifacts/brief-b-baseline/lint.txt
      - name: Initialize isolated database
        if: always()
        run: pnpm exec supabase init
      - name: Capture source-list database red against 58ba8f5
        continue-on-error: true
        run: |
          source=supabase/migrations/202609090001_living_plan_revisions.sql
          cp "$source" "$RUNNER_TEMP/brief-b-migration.sql"
          trap 'cp "$RUNNER_TEMP/brief-b-migration.sql" "$source"' EXIT
          git show 58ba8f5:"$source" > "$source"
          pnpm exec supabase db start
          pnpm exec supabase test db supabase/tests/database/20260909_living_plan_revision.test.sql --local 2>&1 | tee artifacts/brief-b-baseline/source-database-red.txt
      - name: Replay corrected migrations for the persistence contract
        if: always()
        run: pnpm exec supabase db reset --local
      - name: Capture persistence baseline
        if: always()
        continue-on-error: true
        run: pnpm exec supabase test db supabase/tests/database/20260909_living_plan_revision.test.sql --local 2>&1 | tee artifacts/brief-b-baseline/database.txt
      - name: Capture actual routed patch persistence
        if: always()
        continue-on-error: true
        run: pnpm exec supabase test db /tmp/yova-living-plan-routed.test.sql --local 2>&1 | tee artifacts/brief-b-baseline/routed-database.txt
      - name: Check the full migrated database suite
        if: always()
        continue-on-error: true
        run: pnpm exec supabase test db --local 2>&1 | tee artifacts/brief-b-baseline/full-database.txt
      - name: Lint migrated database
        if: always()
        continue-on-error: true
        run: pnpm exec supabase db lint --local --level warning --fail-on error 2>&1 | tee artifacts/brief-b-baseline/database-lint.txt
      - name: Stop isolated database
        if: always()
        run: pnpm exec supabase stop --no-backup
      - name: Install isolated browser
        run: |
          # The hosted image includes a Google Chrome apt source unrelated to
          # Playwright's pinned Chromium download. Its inconsistent metadata
          # must not prevent installing Ubuntu browser libraries. Temporarily
          # isolate only that source; never bypass package integrity checks.
          quarantine="$RUNNER_TEMP/yova-browser-apt-sources"
          mkdir -p "$quarantine"
          restore_sources() {
            for source in "$quarantine"/*; do
              if test -f "$source"; then sudo mv "$source" /etc/apt/sources.list.d/; fi
            done
          }
          trap restore_sources EXIT
          sudo python3 - "$quarantine" <<'PYTHON'
          import re, shutil, sys
          from pathlib import Path
          for source in Path('/etc/apt/sources.list.d').iterdir():
              if source.suffix not in ('.list', '.sources'):
                  continue
              active = '\n'.join(line for line in source.read_text().splitlines() if not line.lstrip().startswith('#'))
              urls = re.findall(r'https?://[^\s#]+', active)
              if not any('dl.google.com/linux/chrome-stable' in url for url in urls):
                  continue
              if not all(url.startswith(('https://dl.google.com/linux/chrome-stable', 'http://dl.google.com/linux/chrome-stable')) for url in urls):
                  raise RuntimeError('The Chrome source shares a file with another repository; cannot isolate it safely.')
              print(f'Temporarily isolating hosted-image source: {source.name}')
              shutil.move(str(source), str(Path(sys.argv[1]) / source.name))
          PYTHON
          pnpm exec playwright install --with-deps chromium

      - name: Capture Brief B desktop and mobile journey
        if: always()
        continue-on-error: true
        env:
          YOVA_PERSONALIZATION_ROLLOUT_PERCENT: "100"
        run: pnpm exec playwright test e2e/living-plan.spec.ts --project=desktop-chromium --project=mobile-chromium --workers=1 --retries=0 2>&1 | tee artifacts/brief-b-baseline/browser.txt
      - name: Preserve Brief B journey video and screenshots before compatibility checks
        if: always()
        run: |
          if test -d test-results; then cp -R test-results artifacts/brief-b-baseline/living-plan-journey; fi
      - name: Capture existing edit-journey compatibility
        if: always()
        continue-on-error: true
        env:
          YOVA_PERSONALIZATION_ROLLOUT_PERCENT: "100"
        run: pnpm exec playwright test e2e/core-learning-loop.spec.ts --grep 'unverified topic rewrite|map revision cannot activate|a multi-session plan carries|normal-plan review changes one offered method|adjusting ordinary future work|a visibly shortened inside recipe|a 10-minute outside teaching-first|learner text fields keep long pastes' --project=desktop-chromium --project=mobile-chromium --workers=1 --retries=0 2>&1 | tee artifacts/brief-b-baseline/core-edit-compatibility.txt
      - name: Describe the baseline accurately
        if: always()
        env:
          ROUTE_OUTCOME: ${{ steps.route.outcome }}
          BROWSER_OUTCOME: see-browser-artifact
        run: |
          printf 'Pre-implementation evidence only; this is not a release gate.\n\nRoute contract: %s\n\nBrowser contract: %s\n' "$ROUTE_OUTCOME" "$BROWSER_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-b-baseline-${{ github.sha }}
          path: |
            artifacts/brief-b-baseline
            test-results
          if-no-files-found: error
          retention-days: 30
