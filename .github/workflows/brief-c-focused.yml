name: Brief C focused evidence

on:
  push:
    branches: [codex/brief-c-source-first-practice]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brief-c-focused-evidence
  cancel-in-progress: false

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Los_Angeles
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare evidence
        run: |
          mkdir -p artifacts/brief-c
          git rev-parse HEAD > artifacts/brief-c/source-sha.txt
      - name: Mixed-source learner entry regression
        run: |
          for sample in 1 2 3; do
            pnpm exec vitest run src/evals/brief-c-source-boundary.test.ts src/lib/plan-revision src/lib/study-route/source-contract.test.ts src/lib/study-route/normal-plan-envelope-integration.test.ts src/lib/plan-generation/normal-plan-pipeline.test.ts --reporter=default --reporter=json --outputFile=artifacts/brief-c/source-boundary-$sample.json
          done
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm exec tsc --noEmit
      - name: Block cache delivery
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run src/evals/brief-c-block-cache.test.ts src/lib/session-generation/resource.test.ts --reporter=default --reporter=json --outputFile=artifacts/brief-c/block-cache.json
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: Preserve Brief 0.5 negative protections
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run src/lib/openai/streamed-validator-calibration.test.ts src/lib/session-generation/question-context.test.ts src/evals/brief-0-5-rubric.test.ts src/lib/session-generation/completion-contract.test.ts src/lib/session-generation/lesson-brief.test.ts --reporter=default --reporter=json --outputFile=artifacts/brief-c/negative-protections.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brief-c-focused-${{ github.run_id }}
          path: artifacts/brief-c
          retention-days: 30
