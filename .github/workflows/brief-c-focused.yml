name: Brief C focused evidence

on:
  push:
    branches: [codex/brief-c-source-first-practice]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brief-c-focused-evidence
  cancel-in-progress: false

jobs:
  source-boundary:
    if: ${{ !contains(github.event.head_commit.message, '[brief-c-full]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Los_Angeles
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check live-gate artifact protections
        run: node --test --test-concurrency=1 scripts/live-gate/*.test.mjs
      - name: Prepare evidence
        run: |
          mkdir -p artifacts/brief-c
          git rev-parse HEAD > artifacts/brief-c/source-sha.txt
      - name: Mixed-source learner entry regression
        run: |
          for sample in 1 2 3; do
            pnpm exec vitest run src/evals/brief-c-source-boundary.test.ts src/lib/plan-revision src/lib/study-route/source-contract.test.ts src/lib/study-route/normal-plan-envelope-integration.test.ts src/lib/plan-generation/normal-plan-pipeline.test.ts --reporter=default --reporter=json --outputFile=artifacts/brief-c/source-boundary-$sample.json
          done
      - name: Full unit compatibility
        if: ${{ !cancelled() && contains(github.event.head_commit.message, '[brief-c-unit]') }}
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=artifacts/brief-c/full-unit.json
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm exec tsc --noEmit
      - name: Block cache delivery
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run src/evals/brief-c-block-cache.test.ts src/lib/session-generation/resource.test.ts --reporter=default --reporter=json --outputFile=artifacts/brief-c/block-cache.json
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: Block generation defaults
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run src/evals/brief-c-generation.test.ts src/evals/brief-c-source-media.test.ts src/lib/session-blocks/provider.test.ts src/lib/session-blocks/explanation-stream.test.ts src/components/saved-block-resources.test.ts src/evals/brief-c-block-runtime.test.ts src/lib/study-route/generation-contract.test.ts src/app/api/sessions/block/route.test.ts --reporter=default --reporter=json --outputFile=artifacts/brief-c/block-generation.json
      - name: Preserve Brief 0.5 negative protections
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run src/lib/openai/streamed-validator-calibration.test.ts src/lib/session-generation/question-context.test.ts src/evals/brief-0-5-rubric.test.ts src/lib/session-generation/completion-contract.test.ts src/lib/session-generation/lesson-brief.test.ts --reporter=default --reporter=json --outputFile=artifacts/brief-c/negative-protections.json
      - name: Compare the existing Brief B database fixture on merged main
        if: ${{ !cancelled() && contains(github.event.head_commit.message, '[brief-c-main]') }}
        run: |
          baseline="$RUNNER_TEMP/brief-c-main-baseline"
          mkdir -p "$baseline"
          git archive 80323614fec32563a340528fb558a84657a00773 | tar -x -C "$baseline"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          cd "$baseline"
          YOVA_DB_FIXTURE_PATH="$RUNNER_TEMP/main-living-plan.sql" pnpm exec vitest run src/lib/plan-revision/database-contract.fixture.test.ts --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/artifacts/brief-c/main-b-database-fixture.json"
      - name: Live prepared-practice canaries
        if: ${{ !cancelled() && contains(github.event.head_commit.message, '[brief-c-live]') }}
        run: pnpm exec vitest run src/evals/brief-c-practice.live.test.ts --maxWorkers=1 --retry=0 --reporter=default --reporter=json --outputFile=artifacts/brief-c/block-live.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOVA_RUN_LIVE_BLOCKS: "1"
          YOVA_BLOCK_CAPTURE: ${{ github.workspace }}/artifacts/brief-c/provider-captures.jsonl
          YOVA_BLOCK_PRINTOUT: ${{ github.workspace }}/artifacts/brief-c/profile-blocks.json
      - name: Saved explanation stream compatibility
        if: ${{ !cancelled() && contains(github.event.head_commit.message, '[brief-c-streams]') }}
        run: |
          pnpm exec vitest run src/evals/launch-session-journeys.live.test.ts --maxWorkers=1 --retry=0 --reporter=default --reporter=json --outputFile=artifacts/brief-c/stream-producer.json
          pnpm exec vitest run src/evals/launch-lesson-streams.live.test.ts --maxWorkers=1 --retry=0 --reporter=default --reporter=json --outputFile=artifacts/brief-c/stream-compatibility.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOVA_RUN_LIVE_LAUNCH_EVALS: "1"
          YOVA_RUN_LIVE_LESSON_EVALS: "1"
          YOVA_LIVE_FIXTURE_ROOT: ${{ github.workspace }}/artifacts/brief-c/compat-fixtures
      - name: Current-production launch and saved-lesson compatibility
        if: ${{ !cancelled() && contains(github.event.head_commit.message, '[brief-c-compat-live]') }}
        run: |
          status=0
          for suite in launch-session-journeys launch-lesson-streams plan-creation-blockers; do
            pnpm exec vitest run "src/evals/$suite.live.test.ts" --maxWorkers=1 --retry=0 --reporter=default --reporter=json --outputFile="artifacts/brief-c/$suite.json" || status=$?
          done
          exit "$status"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOVA_RUN_LIVE_LAUNCH_EVALS: "1"
          YOVA_RUN_LIVE_LESSON_EVALS: "1"
          YOVA_RUN_LIVE_PLAN_BLOCKERS: "1"
          YOVA_LIVE_FIXTURE_ROOT: ${{ github.workspace }}/artifacts/brief-c/compat-fixtures
      - name: Replay database migrations and check block authority
        if: ${{ !cancelled() && contains(github.event.head_commit.message, '[brief-c-db]') }}
        run: |
          set -o pipefail
          pnpm exec supabase init
          pnpm exec supabase db start
          YOVA_BLOCK_DB_FIXTURE_PATH=supabase/tests/database/20260910_work_block_generated.test.sql pnpm exec vitest run src/evals/brief-c-block-database.fixture.test.ts
          fixture_status=0
          YOVA_DB_FIXTURE_PATH=supabase/tests/database/20260910_living_plan_generated.test.sql pnpm exec vitest run src/lib/plan-revision/database-contract.fixture.test.ts --reporter=default --reporter=json --outputFile=artifacts/brief-c/b-database-fixture.json || fixture_status=$?
          pnpm exec supabase db lint --local --level warning --fail-on error
          pnpm exec supabase test db --local | tee artifacts/brief-c/block-database.txt
          exit "$fixture_status"
      - name: Stop isolated database
        if: ${{ always() && contains(github.event.head_commit.message, '[brief-c-db]') }}
        run: pnpm exec supabase stop --no-backup
      - name: Install focused browser
        if: ${{ !cancelled() && (contains(github.event.head_commit.message, '[brief-c-browser]') || contains(github.event.head_commit.message, '[brief-c-live-browser]')) }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Source-first desktop and mobile journey
        if: ${{ !cancelled() && contains(github.event.head_commit.message, '[brief-c-browser]') }}
        run: pnpm exec playwright test e2e/source-first-block.spec.ts --retries=0 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/brief-c/browser.json
      - name: Existing live browser journeys with the new block contract
        if: ${{ !cancelled() && contains(github.event.head_commit.message, '[brief-c-live-browser]') }}
        run: |
          pnpm exec vitest run src/evals/plan-creation-blockers.live.test.ts --testNamePattern 'a ten-minute triage' --maxWorkers=1 --retry=0 --reporter=default --reporter=json --outputFile=artifacts/brief-c/deadline-producer.json
          pnpm exec playwright test e2e/plan-launch-live.spec.ts --config playwright.live.config.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOVA_RUN_LIVE_PLAN_BLOCKERS: "1"
          YOVA_RUN_LIVE_BROWSER_CANARY: "1"
          YOVA_LIVE_FIXTURE_ROOT: ${{ github.workspace }}/artifacts/brief-c/compat-fixtures
          YOVA_LIVE_BROWSER_OUTPUT: ${{ github.workspace }}/artifacts/brief-c/live-browser
      - name: Retain focused browser captures
        if: always()
        run: |
          if test -d test-results; then cp -R test-results artifacts/brief-c/browser; fi
      - name: Sanitize published evidence
        id: sanitize
        if: always()
        run: node scripts/sanitize-ci-artifacts.mjs artifacts/brief-c
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.sanitize.outcome == 'success' }}
        with:
          name: brief-c-focused-${{ github.run_id }}
          path: artifacts/brief-c
          retention-days: 30
