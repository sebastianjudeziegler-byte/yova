name: YOVA quality — release renamed-equation red
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: yova-quality-${{ github.ref }}
  cancel-in-progress: true
# Temporary red/green evidence only. Restore the full gate before merge.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify mixed-criterion grader green
        run: |
          mkdir -p test-results/release-boundaries
          pnpm exec vitest run src/lib/openai/answer-evaluator.test.ts --maxWorkers=1 --retry=0 --reporter=default --reporter=json --outputFile=test-results/release-boundaries/grader-green.json
      - name: Establish renamed-equation red with negative boundaries
        run: |
          result=0
          pnpm exec vitest run src/lib/openai/streamed-validator-calibration.test.ts --maxWorkers=1 --retry=0 --reporter=default --reporter=json --outputFile=test-results/release-boundaries/renamed-red.json || result=$?
          test "$result" -eq 1
          node -e 'const r=require("./test-results/release-boundaries/renamed-red.json"); if(r.numFailedTests !== 4 || r.numPassedTests < 20) process.exit(1)'
      - name: Upload per-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-boundaries-${{ github.run_id }}
          path: |
            test-results/release-boundaries
            test-results/release-observations
          retention-days: 30
