name: YOVA quality — release boundary green
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: yova-quality-${{ github.ref }}
  cancel-in-progress: true
# Temporary red/green evidence only. Restore the full gate before merge.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify mixed-criterion grader green
        run: |
          mkdir -p test-results/release-boundaries
          pnpm exec vitest run src/lib/openai/answer-evaluator.test.ts --maxWorkers=1 --retry=0 --reporter=default --reporter=json --outputFile=test-results/release-boundaries/grader-green.json
      - name: Verify equation, allocation and rubric green with negatives
        run: |
          pnpm exec vitest run src/lib/session-generation/lesson-brief.test.ts src/lib/openai/streamed-validator-calibration.test.ts src/evals/brief-0-5-rubric.test.ts src/lib/session-generation/completion-contract.test.ts src/lib/session-generation/content-specificity.test.ts src/lib/session-generation/streamed-skeleton.test.ts --maxWorkers=1 --retry=0 --reporter=default --reporter=json --outputFile=test-results/release-boundaries/validator-green.json
      - name: Run three serial live samples with pass-through capture
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p tmp/brief-0-5
          cp docs/audits/brief-0-5/evidence/harness/ci-capture.ts.txt tmp/brief-0-5/capture.ts
          cp docs/audits/brief-0-5/evidence/harness/vitest.config.mts.txt tmp/release-capture.config.mts
          python3 - <<'PYTHON'
          from pathlib import Path
          source = Path('docs/audits/brief-0-5/evidence/harness/new-observations.py.txt').read_text()
          source = source.replace('results = []', "cases = [case for case in cases if case[0] in ('A15', 'A27', 'misconception')]\nresults = []")
          Path('tmp/release-boundaries.py').write_text(source)
          PYTHON
          python3 tmp/release-boundaries.py release
      - name: Upload per-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-boundaries-${{ github.run_id }}
          path: |
            test-results/release-boundaries
            test-results/release-observations
          retention-days: 30
