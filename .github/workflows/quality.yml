name: YOVA quality — focused release diagnosis

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: yova-quality-${{ github.ref }}
  cancel-in-progress: true

# Temporary diagnostic run. Restore the complete quality workflow before merge.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Los_Angeles
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare pass-through fixture capture
        run: |
          mkdir -p tmp/brief-0-5 test-results/release-repro
          cp docs/audits/brief-0-5/evidence/harness/ci-capture.ts.txt tmp/brief-0-5/capture.ts
          cp docs/audits/brief-0-5/evidence/harness/vitest.config.mts.txt tmp/release-capture.config.mts
      - name: Date-recall red and existing negative checks
        run: pnpm exec vitest run src/lib/session-generation/question-context.test.ts src/lib/openai/streamed-validator-calibration.test.ts --maxWorkers=1 --retry=0 --reporter=default --reporter=json --outputFile=test-results/release-repro/date-recall.json
      - name: Capture three unchanged mapped-calculus attempts
        if: ${{ !cancelled() }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOVA_RUN_LIVE_SESSION_EVALS: "1"
          YOVA_SESSION_EVAL_CASE: calculus_product_chain_streamed_25
        run: |
          result=0
          for sample in 1 2 3; do
            BRIEF05_CAPTURE="test-results/release-repro/calculus-$sample.jsonl" pnpm exec vitest run src/evals/session-quality.live.test.ts --config tmp/release-capture.config.mts --maxWorkers=1 --retry=0 --reporter=default --reporter=json --outputFile="test-results/release-repro/calculus-$sample.json" || result=1
          done
          exit "$result"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-repro-${{ github.run_id }}
          path: test-results/release-repro
          retention-days: 30
