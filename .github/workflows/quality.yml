name: YOVA quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: yova-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Date-oriented learner flows are defined in YOVA's launch timezone.
      # GitHub runners default to UTC, which made otherwise-correct deadline
      # tests fail only in CI.
      TZ: America/Los_Angeles
      DO_NOT_TRACK: "1"

    steps:
      - name: Check out YOVA
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Validate production configuration rules
        run: pnpm readiness:configuration
        # These are deliberately non-secret fixtures. This executes the same
        # configuration-shape contract without copying live Vercel credentials
        # into GitHub. It is explicitly not release approval: the production
        # build and smoke gates verify the real database capability contract.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-readiness.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_readiness_only
          SUPABASE_SECRET_KEY: sb_secret_ci_readiness_only
          OPENAI_API_KEY: sk-ci-readiness-only-not-a-real-key
          CRON_SECRET: ci-readiness-only-cron-secret-000000000000
          YOVA_DRAFT_RECEIPT_SECRET: ci-readiness-only-draft-receipt-secret-000000
          SITE_URL: https://www.yovaapp.com
          RESEND_API_KEY: re_ci_readiness_only_not_a_real_key
          STUDY_PROFILE_FROM_EMAIL: YOVA <reports@yovaapp.com>
          YOVA_PERSONALIZATION_ROLLOUT_PERCENT: "0"
          AUTH_PASSWORD_ACCOUNTS: "true"
          AUTH_INVITE_ONLY: "false"
          AUTH_CAPTCHA_ENABLED: "true"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          AUTH_EMAIL_CODE_VERIFICATION: "true"
          NEXT_PUBLIC_OPENAI_API_KEY: ""
          NEXT_PUBLIC_SUPABASE_SECRET_KEY: ""
          NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY: ""

      - name: Initialize isolated database configuration
        run: pnpm exec supabase init

      - name: Replay every database migration
        run: pnpm exec supabase db start

      - name: Lint the migrated database
        run: pnpm exec supabase db lint --local --level warning --fail-on error

      - name: Test migrated database boundaries
        run: pnpm exec supabase test db --local

      - name: Stop isolated database
        if: always()
        continue-on-error: true
        run: pnpm exec supabase stop --no-backup

      - name: Install isolated browser
        run: |
          # The hosted image includes a Google Chrome apt source unrelated to
          # Playwright's pinned Chromium download. Its inconsistent metadata
          # must not prevent installing Ubuntu browser libraries. Temporarily
          # isolate only that source; never bypass package integrity checks.
          quarantine="$RUNNER_TEMP/yova-browser-apt-sources"
          mkdir -p "$quarantine"
          restore_sources() {
            for source in "$quarantine"/*; do
              if test -f "$source"; then sudo mv "$source" /etc/apt/sources.list.d/; fi
            done
          }
          trap restore_sources EXIT
          sudo python3 - "$quarantine" <<'PYTHON'
          import re, shutil, sys
          from pathlib import Path
          for source in Path('/etc/apt/sources.list.d').iterdir():
              if source.suffix not in ('.list', '.sources'):
                  continue
              active = '\n'.join(line for line in source.read_text().splitlines() if not line.lstrip().startswith('#'))
              urls = re.findall(r'https?://[^\s#]+', active)
              if not any('dl.google.com/linux/chrome-stable' in url for url in urls):
                  continue
              if not all(url.startswith(('https://dl.google.com/linux/chrome-stable', 'http://dl.google.com/linux/chrome-stable')) for url in urls):
                  raise RuntimeError('The Chrome source shares a file with another repository; cannot isolate it safely.')
              print(f'Temporarily isolating hosted-image source: {source.name}')
              shutil.move(str(source), str(Path(sys.argv[1]) / source.name))
          PYTHON
          pnpm exec playwright install --with-deps chromium

      - name: Prepare closeout evidence
        if: ${{ !cancelled() }}
        run: mkdir -p artifacts/quality

      - name: Run learning-engine tests
        if: ${{ !cancelled() }}
        run: |
          pnpm exec vitest run --reporter=default --reporter=json --outputFile=artifacts/quality/unit.json
          node --test --test-concurrency=1 scripts/live-gate/*.test.mjs

      - name: Check code quality
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Check TypeScript
        if: ${{ !cancelled() }}
        run: pnpm exec tsc --noEmit

      - name: Build production app
        if: ${{ !cancelled() }}
        run: pnpm build

      - name: Run core learner journey
        if: ${{ !cancelled() }}
        continue-on-error: ${{ github.head_ref == 'codex/brief-b-living-plan' }}
        run: pnpm test:e2e --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/quality/browser.json

      - name: Preserve core and founder browser evidence
        if: always()
        run: |
          if test -d test-results; then cp -R test-results artifacts/quality/core-browser; fi

      # Baseline session shapes (docs/redesign): the flag-on server and its
      # own cases, kept separate so the pre-baseline suite above runs
      # unchanged and this step's result is visible on its own.
      - name: Run baseline session journey
        if: ${{ !cancelled() }}
        run: pnpm test:e2e:baseline --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/quality/baseline-browser.json

      - name: Preserve baseline browser evidence
        if: always()
        run: |
          if test -d test-results; then cp -R test-results artifacts/quality/baseline-browser; fi

      - name: Run public authentication journey
        if: ${{ !cancelled() }}
        run: pnpm test:e2e:auth --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/quality/auth.json

      - name: Preserve authentication evidence
        if: always()
        run: |
          if test -d test-results; then cp -R test-results artifacts/quality/auth-browser; fi

      - name: Compare the Study Profile phone-width case on main and release
        if: ${{ !cancelled() }}
        run: node scripts/compare-study-profile-ci.mjs

      - name: Upload Study Profile comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-profile-phone-comparison-${{ github.run_id }}
          path: test-results/study-profile-comparison
          if-no-files-found: ignore
          retention-days: 30

      - name: Run full live gate on the combined release
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: ${{ github.head_ref == 'codex/brief-b-living-plan' }}
        run: |
          if test "$LIVE_GATE_RUNS" = 3; then
            mkdir -p tmp/brief-0-5 test-results/live-gate
            cp docs/audits/brief-0-5/evidence/harness/ci-capture.ts.txt tmp/brief-0-5/capture.ts
            cp vitest.config.mts /tmp/yova-original-vitest.mts
            trap 'cp /tmp/yova-original-vitest.mts vitest.config.mts' EXIT
            python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('vitest.config.mts')
          source = path.read_text()
          path.write_text(source.replace('test: {', 'test: {\n    setupFiles: ["tmp/brief-0-5/capture.ts"],', 1))
          PYTHON
            export BRIEF05_CAPTURE="$PWD/test-results/live-gate/provider-captures.jsonl"
          fi
          pnpm test:live --runs "$LIVE_GATE_RUNS"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOVA_DELTA_PRINTOUT: ${{ github.workspace }}/test-results/live-gate/profile-plans.json
          # Three serial release samples; ordinary main/PR gates retain one.
          LIVE_GATE_RUNS: ${{ github.head_ref == 'codex/brief-0-5-grader-and-validators' && '3' || '1' }}

      - name: Gate Brief B on regressions versus retained main
        if: ${{ !cancelled() && github.head_ref == 'codex/brief-b-living-plan' }}
        run: |
          node scripts/compare-release-ci.mjs
          cat artifacts/quality/regression-comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish full live gate evidence
        if: always()
        run: |
          if test -f test-results/live-gate/report.md; then
            cat test-results/live-gate/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full live gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-live-gate-${{ github.run_id }}
          path: test-results/live-gate
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload closeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yova-quality-evidence-${{ github.run_id }}
          path: |
            artifacts/quality
            test-results
          if-no-files-found: ignore
          retention-days: 7
